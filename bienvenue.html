<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<script>(function(){var t=localStorage.getItem('edulya_theme');if(t==='light'){document.documentElement.setAttribute('data-theme','light');}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDULYA-TECH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
<style>
  .welcome-screen{
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 24px;
    gap: 32px;
  }
  .welcome-logo{
    width: min(320px, 70vw);
    height: auto;
    animation: welcome-fade-in .8s ease both;
  }
  .welcome-text{
    max-width: 46ch;
    color: var(--muted);
    animation: welcome-fade-in .8s ease .15s both;
  }
  .welcome-cta{ animation: welcome-fade-in .8s ease .3s both; }
  @keyframes welcome-fade-in{
    from{ opacity: 0; transform: translateY(12px); }
    to{ opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce){
    .welcome-logo, .welcome-text, .welcome-cta{ animation: none; }
  }
</style>
</head>
<body>

<button class="theme-toggle" id="themeToggle" aria-label="Changer le thème" style="position:fixed; top:20px; right:20px; z-index:10;">
  <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
  <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
</button>

<section class="welcome-screen">
  <img src="images/logo-full.png" alt="EDULYA-TECH — Former. Innover. Transformer." class="welcome-logo">
  <p class="welcome-text">Bienvenue sur EDULYA-TECH, la plateforme de formation numérique qui t'accompagne vers les métiers de la tech — cybersécurité, développement web, Python, IA et réseaux.</p>
  <a href="index.html" class="btn btn-primary btn-lg welcome-cta" id="enterSiteBtn">Entrer sur le site</a>
</section>

<script>
  document.getElementById('enterSiteBtn').addEventListener('click', () => {
    sessionStorage.setItem('edulya_welcomed', '1');
  });
</script>

<script src="js/config.js"></script>
<script src="js/script.js"></script>
</body>
</html>
